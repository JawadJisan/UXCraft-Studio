name: Deploy to GitHub Pages

on:
  push:
    branches: [JawadDev]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: # Add this block
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for GH Pages action

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: uxcraftstudio.com
          enable_jekyll: false
          keep_files: false # Clean old files on deploy
